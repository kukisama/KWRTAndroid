name: release

# 触发：手动 dispatch 或者打 v* tag（如 v0.1.0、v1.2.3）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 需要写 release

jobs:
  # ---------- 1) Windows: 编译 Tauri exe ----------
  windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable + msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo build --release
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/kwrt-controller.exe `
            out/kwrt-controller-windows-x64.exe -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: out/kwrt-controller-windows-x64.exe
          if-no-files-found: error

  # ---------- 2) Android: 只编 arm64-v8a release apk ----------
  android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # build.gradle.kts 里 splits.abi 已经限定只编 arm64-v8a，
      # 这里 assembleRelease 只会产出 app-arm64-v8a-release.apk
      - name: Assemble release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/app-arm64-v8a-release.apk)
          test -f "$APK" || { echo "missing $APK"; exit 1; }
          cp "$APK" out/kwrt-controller-android-arm64-v8a.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/kwrt-controller-android-arm64-v8a.apk
          if-no-files-found: error

  # ---------- 3) 发布 Release（仅 tag 触发时） ----------
  release:
    name: Publish GitHub Release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download windows-exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - name: Download android-apk
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: List
        run: ls -lh dist/

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kwrt-controller-windows-x64.exe
            dist/kwrt-controller-android-arm64-v8a.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## KWRT Controller ${{ github.ref_name }}

            - Windows: `kwrt-controller-windows-x64.exe`（双击运行，无需安装）
            - Android: `kwrt-controller-android-arm64-v8a.apk`（arm64-v8a，绝大多数 64 位安卓手机）

            > 详见 README。Android APK 未做正式签名，安装时会提示来源不明，确认即可。
