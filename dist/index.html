<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KWRT Controller</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">KWRT Controller</div>
      <div class="status" id="status-line">未连接</div>
      <button id="btn-disconnect" class="ghost" hidden>退出登录</button>
    </header>

    <main id="view-login" class="view">
      <h2>登录路由器</h2>
      <p class="hint">
        在 <code>路由器 IP</code> 一栏填 LAN 地址（例如 <code>10.0.0.1</code>）。
        密码可勾选"记住密码"保存到 Windows 凭据管理器；不会写入任何明文文件。
      </p>
      <form id="form-login">
        <div class="row">
          <label>协议
            <select name="scheme">
              <option value="http" selected>http</option>
              <option value="https">https</option>
            </select>
          </label>
          <label class="grow">路由器 IP / 域名
            <input name="host" required placeholder="10.0.0.1" autocomplete="off" />
          </label>
          <label>端口（可选）
            <input name="port" type="number" min="1" max="65535" placeholder="80 / 443" />
          </label>
        </div>
        <div class="row">
          <label class="grow">用户名
            <input name="username" required value="root" autocomplete="off" />
          </label>
          <label class="grow">密码
            <input name="password" type="password" required autocomplete="off" />
          </label>
        </div>
        <div class="row checks">
          <label><input type="checkbox" name="remember" /> 记住密码（写入 Windows 凭据管理器）</label>
          <label title="仅在你信任该路由器且用了自签 HTTPS 时勾选">
            <input type="checkbox" name="accept_invalid_certs" /> 允许自签 / 不受信任的 HTTPS 证书
          </label>
        </div>
        <div class="row actions">
          <button type="submit" id="btn-login" class="primary">登录并检测</button>
          <button type="button" id="btn-forget" class="danger ghost">忘记此账号的保存密码</button>
        </div>
      </form>
      <div id="login-error" class="error" hidden></div>
    </main>

    <main id="view-main" class="view" hidden>
      <section class="card">
        <h3>诊断报告</h3>
        <div id="banner" class="banner"></div>
        <ul id="checks" class="checks-list"></ul>
        <details>
          <summary>已识别的全部 UCI 配置</summary>
          <div id="configs" class="mono small"></div>
        </details>
        <div class="row actions">
          <button id="btn-redetect" class="ghost">重新运行检测</button>
        </div>
      </section>

      <section class="card" id="actions-card">
        <h3>快捷动作 — 直连列表</h3>
        <div id="actions-disabled" class="error" hidden>
          未识别到 PassWall（passwall / passwall2），或未找到直连列表文件。请确认路由器固件已安装 luci-app-passwall。
        </div>
        <div id="actions-enabled" hidden>
          <p class="hint">
            当前直连列表文件：<code id="direct-path"></code>
            （任何加入这里的 IP / 域名将<strong>不走代理</strong>，直连出局）
          </p>
          <form id="form-add">
            <input name="entry" required placeholder="例如 1.2.3.4 或 1.2.3.0/24 或 example.com" />
            <button type="submit" class="primary">加入直连</button>
          </form>
          <div id="add-msg" class="msg" hidden></div>

          <div class="row actions">
            <button id="btn-reload" class="ghost">reload PassWall</button>
            <button id="btn-restart" class="danger ghost">restart PassWall</button>
            <button id="btn-refresh-list" class="ghost">刷新列表</button>
          </div>

          <h4>当前直连规则（<span id="entry-count">0</span> 条）</h4>
          <ul id="direct-list" class="entries"></ul>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
