<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KWRT Controller</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // 早期同步应用主题，避免 FOUC
      (function () {
        try {
          var t = localStorage.getItem("kwrt.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">KWRT Controller</div>
      <div class="status" id="status-line">未连接</div>
      <button id="btn-theme" class="icon-btn" data-tip="切换主题">🌗</button>
      <button id="btn-disconnect" class="ghost" hidden data-tip="断开当前连接并回到登录页（不会删除已保存的密码）">退出登录</button>
    </header>

    <!-- 登录视图 -->
    <main id="view-login" class="view">
      <h2>登录路由器</h2>
      <p class="hint">
        在 <code>路由器 IP</code> 一栏填 LAN 地址（例如 <code>10.0.0.1</code>）。
        密码可勾选"记住密码"保存到 Windows 凭据管理器；不会写入任何明文文件。
      </p>
      <form id="form-login">
        <div class="row">
          <label data-tip="LuCI 使用的协议，自签证书的路由器一般选 http">协议
            <select name="scheme">
              <option value="http" selected>http</option>
              <option value="https">https</option>
            </select>
          </label>
          <label class="grow" data-tip="路由器在局域网中的地址，例如 10.0.0.1 / 192.168.1.1">路由器 IP / 域名
            <input name="host" required placeholder="10.0.0.1" autocomplete="off" />
          </label>
          <label data-tip="留空表示按协议默认端口（http=80, https=443）">端口（可选）
            <input name="port" type="number" min="1" max="65535" placeholder="80 / 443" />
          </label>
        </div>
        <div class="row">
          <label class="grow" data-tip="登录 LuCI 的用户名，OpenWrt 默认是 root">用户名
            <input name="username" required value="root" autocomplete="off" />
          </label>
          <label class="grow" data-tip="登录 LuCI 的密码；勾选记住密码后将保存在 Windows 凭据管理器">密码
            <input name="password" type="password" required autocomplete="off" />
          </label>
        </div>
        <div class="row checks">
          <label data-tip="勾选后密码加密存入 Windows 凭据管理器，不写入任何配置文件">
            <input type="checkbox" name="remember" /> 记住密码
          </label>
          <label data-tip="仅在你信任该路由器且用了自签 HTTPS 时勾选；http 模式下无影响">
            <input type="checkbox" name="accept_invalid_certs" /> 允许自签 / 不受信任的 HTTPS 证书
          </label>
        </div>
        <div class="row actions">
          <button type="submit" id="btn-login" class="primary" data-tip="登录并立即对路由器做一次 PassWall 诊断">登录并检测</button>
          <button type="button" id="btn-forget" class="danger ghost" data-tip="从 Windows 凭据管理器中删除该 用户@主机 的保存密码">忘记此账号的保存密码</button>
        </div>
      </form>
      <div id="login-error" class="error" hidden></div>
    </main>

    <!-- 主视图 -->
    <main id="view-main" class="view" hidden>
      <!-- 顶部诊断条 -->
      <section class="card">
        <div id="banner" class="banner"></div>
        <div class="row actions">
          <button id="btn-redetect" class="ghost" data-tip="重新跑一次 ubus / uci 探测，刷新顶部诊断信息">重新检测</button>
          <button id="btn-refresh-all" class="ghost" data-tip="拉取最新的完整 PassWall 配置并刷新所有面板">刷新全部</button>
          <span class="grow"></span>
          <button id="btn-reload" class="ghost" data-tip="reload init 脚本：让最新 uci 配置生效，通常无需中断连接">reload PassWall</button>
          <button id="btn-restart" class="danger ghost" data-tip="restart init 脚本：彻底重启 PassWall，会短暂中断代理">restart PassWall</button>
        </div>
      </section>

      <!-- Tab 导航 -->
      <nav id="tabbar" class="tabbar"></nav>
      <!-- Tab 内容容器 -->
      <section id="tabview"></section>
    </main>

    <!-- 浮动 tooltip -->
    <div id="tip" class="tip" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
