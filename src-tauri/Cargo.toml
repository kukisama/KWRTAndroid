[package]
name = "kwrt-controller"
version = "0.1.0"
edition = "2021"
description = "KWRT / OpenWrt PassWall Quick Controller"

[lib]
name = "kwrt_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["windows-native"] }
anyhow = "1"
thiserror = "2"
url = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
